<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #cbd5e1;
    }

    /* Ambient dynamic animations in the background layer */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.25) translate(25px, -15px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPillReverse {
      0% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
      100% { transform: translateY(0px); }
    }

    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite 3s;
      transform-origin: 1000px 300px;
    }
    .flow-path {
      stroke-dasharray: 10 10;
      animation: flowLine 12s linear infinite;
    }
    .pill-group-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-group-2 {
      animation: floatPillReverse 6s ease-in-out infinite 1s;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Glow Orbs -->
  <g class="orb-1">
    <circle cx="200" cy="110" r="130" fill="#38bdf8" filter="url(#glow)" opacity="0.35"/>
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="280" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.35"/>
  </g>

  <!-- Dynamic Technical Grid & Connection Circuit Behind Text -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="420" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="900" y1="0" x2="900" y2="420" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="1100" y1="0" x2="1100" y2="420" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="0" y1="340" x2="1200" y2="340" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- Flow Lines (Background dynamic asset flow) -->
  <path class="flow-path" d="M 60,360 C 300,380 400,320 600,350 C 800,380 950,330 1140,360" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.45"/>
  <path class="flow-path" d="M 60,70 C 250,50 450,110 700,60 C 920,20 1020,90 1140,60" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.35"/>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 115)">
    <!-- Top Category Tag -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <circle cx="14" cy="15" r="4" fill="#38bdf8"/>
    <text x="28" y="20" class="badge-text" fill="#38bdf8">ENTERPRISE DAM &amp; ORG</text>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="80" class="title-text">Awesome Digital Asset Management</text>
    <text x="0" y="132" class="title-text" fill="url(#accentGrad)">&amp; Visual Design Organization</text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle-text">Curated ecosystem of enterprise SaaS platforms, AI asset hubs &amp; open-source projects</text>
  </g>

  <!-- Dynamic Feature Badges / Floating Interactive Modules at Bottom -->
  <g class="pill-group-1" transform="translate(60, 335)">
    <!-- Pill 1: Enterprise DAM -->
    <rect x="0" y="0" width="160" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="18" cy="19" r="6" fill="#38bdf8"/>
    <text x="34" y="24" class="node-text">Enterprise DAM</text>

    <!-- Pill 2: Brand Portals -->
    <rect x="180" y="0" width="160" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="198" cy="19" r="6" fill="#818cf8"/>
    <text x="214" y="24" class="node-text">Brand Guidelines</text>

    <!-- Pill 3: AI Metadata & Tagging -->
    <rect x="360" y="0" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="378" cy="19" r="6" fill="#c084fc"/>
    <text x="394" y="24" class="node-text">AI Visual Tagging</text>
  </g>

  <g class="pill-group-2" transform="translate(610, 335)">
    <!-- Pill 4: Design Systems & Tokens -->
    <rect x="0" y="0" width="175" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="18" cy="19" r="6" fill="#f43f5e"/>
    <text x="34" y="24" class="node-text">Design Systems Kit</text>

    <!-- Pill 5: Self-Hosted Media Servers -->
    <rect x="195" y="0" width="185" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="213" cy="19" r="6" fill="#10b981"/>
    <text x="229" y="24" class="node-text">Self-Hosted Media</text>

    <!-- Pill 6: Open-Source First -->
    <rect x="400" y="0" width="140" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="418" cy="19" r="6" fill="#fbbf24"/>
    <text x="434" y="24" class="node-text">Open Source</text>
  </g>

</svg>